name: Release

# Tag vX.Y.Z (musi zgadzać się z version w package.json) → build exe + rpm + AppImage + flatpak
# → draft release w publicznym OsPross/vio-releases (stamtąd czyta electron-updater).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Tag zgodny z package.json
        if: github.ref_type == 'tag'
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

  linux:
    needs: windows # ten sam draft release — nie twórz go dwa razy równolegle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Narzędzia do flatpaka
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder rpm
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08
      - run: npm ci
      - run: npm run release:linux
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
