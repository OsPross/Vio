name: Release

# Tag vX.Y.Z (musi zgadzać się z version w package.json) → build exe + rpm + AppImage + flatpak
# → opublikowany release w tym samym repo (OsPross/Vio): exe do pobrania + electron-updater.
permissions:
  contents: write # GITHUB_TOKEN tworzy release, osobny sekret niepotrzebny

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Tag zgodny z package.json
        if: github.ref_type == 'tag'
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      # electron-builder uploads in parallel and would create duplicate releases, so create the one first
      - name: Create release
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep Windows installer as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vio-windows
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: warn
          retention-days: 14

  linux:
    needs: windows # Windows zwykle tworzy release; Linux dokłada assety
    # Nie pomijaj Linuxa, gdy Windows padł po wrzuceniu exe (race przy create release)
    if: always() && needs.windows.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Narzędzia do flatpaka
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder rpm
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08
      - run: npm ci
      - run: npm run release:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep Linux packages as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vio-linux
          path: |
            release/*.AppImage
            release/*.rpm
            release/*.flatpak
            release/*.yml
          if-no-files-found: warn
          retention-days: 14
